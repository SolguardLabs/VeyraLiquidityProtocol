[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.24"
auto_detect_solc = false
evm_version = "shanghai"
optimizer = true
optimizer_runs = 1_000
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = false
verbosity = 2

[profile.default.fuzz]
runs = 256
max_test_rejects = 65_536

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = false

[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 512
max_test_rejects = 65_536

[profile.ci.invariant]
runs = 192
depth = 48
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true
sort_imports = true
