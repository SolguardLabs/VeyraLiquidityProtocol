name: Integridad de versión

on:
  push:
    branches: [production]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refs:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar referencias de publicación
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git ls-remote "https://github.com/${REPOSITORY}.git" HEAD refs/heads/main refs/heads/production 'refs/tags/v1.0.0^{}' refs/tags/v1.0.0 > refs.txt
          cat refs.txt
          main=$(awk '$2 == "refs/heads/main" {print $1}' refs.txt)
          production=$(awk '$2 == "refs/heads/production" {print $1}' refs.txt)
          tag=$(awk '$2 == "refs/tags/v1.0.0^{}" {print $1}' refs.txt)
          test -n "$main" && test -n "$production" && test -n "$tag"
          test "$main" = "$production" && test "$main" = "$tag"
